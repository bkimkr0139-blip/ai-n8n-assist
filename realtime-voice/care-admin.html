<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>⚙️ 돌봄 통화 설정 (관리자)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         max-width: 720px; margin: 0 auto; padding: 22px; background: #f4f6fb; color: #20242c; }
  h1 { font-size: 1.45rem; color: #34507e; margin: 6px 0 2px; }
  .sub { color: #6b6b6b; font-size: .98rem; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid #d9e0ee; border-radius: 14px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  input, textarea, select { width: 100%; font-size: 1rem; padding: 11px; border-radius: 10px; border: 1px solid #cdd4e2; font-family: inherit; }
  textarea { min-height: 180px; white-space: pre-wrap; line-height: 1.5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 12px 16px; border-radius: 12px; border: none; color: #fff; background: #34507e; cursor: pointer; font-weight: 700; }
  button.alt { background: #fff; color: #34507e; border: 1px solid #34507e; }
  button.stop { background: #b3433a; }
  button:disabled { opacity: .45; }
  #status { font-size: 1.05rem; padding: 12px; border-radius: 10px; background: #eef2fb; margin: 10px 0; text-align: center; word-break: break-all; }
  #log { display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 13px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; line-height: 1.45; }
  .me { align-self: flex-end; background: #dbe6fb; }
  .ai { align-self: flex-start; background: #e7eef9; }
  .sys { align-self: center; background: #eceff5; font-size: .88rem; color: #6b6b6b; }
  label { font-size: .92rem; color: #44505f; }
</style>
</head>
<body>
  <h1>⚙️ 돌봄 통화 설정 (관리자)</h1>
  <div class="sub">음성으로 대화하며 어르신 돌봄 통화 AI의 말투·추임새·안내사항·맥락관리를 맞춤 설정합니다. 저장하면 <b>어르신 통화(care.html)</b>에 바로 반영됩니다.</div>

  <div class="card">
    <input id="key" type="password" placeholder="OpenAI API Key (sk-...) — 처음 한 번만" autocomplete="off" />
    <div class="row" style="margin-top:10px">
      <label>설정 도우미 목소리</label>
      <select id="voice">
        <option value="alloy">alloy (명료)</option>
        <option value="sage">sage</option>
        <option value="coral">coral</option>
        <option value="shimmer">shimmer</option>
      </select>
      <button id="start">▶ 음성 설정 시작</button>
      <button id="stop" class="stop" disabled>■ 끝내고 설정 저장</button>
    </div>
  </div>

  <div id="status">대기 중 — 키 입력 후 [음성 설정 시작]. 예: "추임새는 정겹게, 약 복용 꼭 확인하게 해줘"</div>

  <div class="card">
    <label>현재 맞춤 설정 (어르신 통화에 적용됨) — 직접 수정도 가능</label>
    <textarea id="cfg" placeholder="아직 설정이 없습니다. 음성으로 말하거나 여기에 직접 적고 [설정 저장]을 누르세요."></textarea>
    <div class="row" style="margin-top:10px">
      <button id="savecfg" class="alt">설정 저장(직접 입력)</button>
      <button id="clearcfg" class="alt">설정 초기화</button>
    </div>
  </div>

  <div id="log"></div>
  <audio id="audio" autoplay></audio>

  <script>
    const MODEL = 'gpt-realtime';
    const CALLS_URL = 'https://api.openai.com/v1/realtime/calls';
    const CFG_KEY = 'care_config';

    const ADMIN_PERSONA =
      '당신은 돌봄 서비스 관리자를 돕는 "AI 설정 도우미"입니다. 관리자가 어르신 돌봄 통화 AI(생활지원사 역할)를 ' +
      '어떻게 동작시키고 싶은지 음성으로 인터뷰하고 정리해 드립니다. 다음 항목을 하나씩 자연스럽게 여쭤보세요: ' +
      '말투/톤(밝게·정겹게·차분히 등), 추임새 방식(예: "아이고~", "그러셨어요~"), 대화 방식(속도·길이·한 번에 하나씩 등), ' +
      '꼭 안내·확인할 사항(약 복용, 식사, 수분, 운동, 안전 점검 등), 대화 맥락 관리 규칙(지난 통화 반영 등), 상황별 주의(외로움·우울·위급 신호 대응). ' +
      '전문적이고 명료하며 간결하게(1~2문장) 말하고, 관리자가 말한 내용을 짧게 확인·요약하며 빠진 부분을 제안하세요. ' +
      '관리자가 "저장/적용/끝/그만"이라고 하면 "설정을 저장하겠습니다"라고 짧게 안내하고 마무리하세요.';

    const $ = (id) => document.getElementById(id);
    const els = { key:$('key'), voice:$('voice'), start:$('start'), stop:$('stop'), status:$('status'),
                  log:$('log'), audio:$('audio'), cfg:$('cfg'), savecfg:$('savecfg'), clearcfg:$('clearcfg') };
    els.key.value = localStorage.getItem('oai_key') || '';
    els.cfg.value = localStorage.getItem(CFG_KEY) || '';

    let pc=null, dc=null, micStream=null, aiBuf='', turns=[], endRequested=false, ending=false;
    const setStatus = (s)=> els.status.textContent = s;
    function add(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; els.log.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'end'}); }

    els.savecfg.onclick = ()=>{ localStorage.setItem(CFG_KEY, els.cfg.value.trim()); setStatus('💾 설정을 저장했습니다. 어르신 통화에 반영됩니다.'); };
    els.clearcfg.onclick = ()=>{ if(confirm('맞춤 설정을 초기화할까요?')){ localStorage.removeItem(CFG_KEY); els.cfg.value=''; setStatus('설정을 초기화했습니다.'); } };

    const END_WORDS = ['저장','적용','끝','그만','마칠','마무리','종료','됐어'];
    function isEndIntent(t){ return END_WORDS.some(w => t.indexOf(w) >= 0); }

    function instructions(){
      const cur = (els.cfg.value||'').trim();
      let ins = ADMIN_PERSONA;
      ins += cur ? '\n\n[현재 저장된 맞춤 설정]\n' + cur + '\n\n이 설정을 바탕으로 보완·수정 사항을 여쭤보고 다듬으세요.'
                 : '\n\n(아직 저장된 설정이 없습니다. 처음부터 함께 만들어 가세요.)';
      return ins;
    }
    function sessionConfig(){
      return { type:'session.update', session:{ type:'realtime', instructions: instructions(),
        audio:{ input:{ transcription:{ model:'whisper-1' }, turn_detection:{ type:'server_vad', threshold:0.5, prefix_padding_ms:200, silence_duration_ms:600 } },
                output:{ voice: els.voice.value, speed: 1.05 } } } };
    }

    async function start(){
      const key = els.key.value.trim(); if(!key){ alert('OpenAI API Key를 입력해 주세요.'); return; }
      localStorage.setItem('oai_key', key);
      els.start.disabled = true; turns=[]; endRequested=false; ending=false;
      try { setStatus('🎤 마이크 권한을 허용해 주세요...'); micStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e){ setStatus('❌ 마이크 권한이 거부되었습니다.'); els.start.disabled=false; return; }

      pc = new RTCPeerConnection();
      pc.ontrack = (e)=> els.audio.srcObject = e.streams[0];
      micStream.getTracks().forEach(t=> pc.addTrack(t, micStream));
      dc = pc.createDataChannel('oai-events');
      dc.onopen = ()=>{ setStatus('🟢 연결됨 — 원하는 대화 방식을 말씀하세요'); try{ dc.send(JSON.stringify(sessionConfig())); }catch{}; try{ dc.send(JSON.stringify({type:'response.create'})); }catch{}; };
      dc.onmessage = (e)=>{ let ev; try{ ev=JSON.parse(e.data); }catch{ return; } const t=ev.type||'';
        if(t.indexOf('input_audio_transcription')>=0 && t.endsWith('.completed')){ if(ev.transcript){ const s=ev.transcript.trim(); add('me','🗣️ '+s); turns.push('관리자: '+s); if(isEndIntent(s)) endRequested=true; } }
        else if(t.endsWith('audio_transcript.delta')){ aiBuf += (ev.delta||''); }
        else if(t.endsWith('audio_transcript.done')){ const s=(ev.transcript||aiBuf).trim(); add('ai','⚙️ '+s); turns.push('도우미: '+s); aiBuf='';
          if(endRequested && !ending){ ending=true; setStatus('설정을 정리·저장하는 중...'); setTimeout(()=>stop(), Math.max(2200, s.length*120)); } }
        else if(t==='error'){ add('sys','⚠️ '+JSON.stringify(ev.error||ev)); }
      };
      pc.onconnectionstatechange = ()=>{ if(['failed','disconnected','closed'].includes(pc.connectionState) && !ending) setStatus('연결 종료됨 ('+pc.connectionState+')'); };
      try{
        const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
        setStatus('연결 중입니다...');
        const resp = await fetch(CALLS_URL+'?model='+encodeURIComponent(MODEL), { method:'POST', body:offer.sdp, headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/sdp' } });
        if(!resp.ok){ const b=await resp.text().catch(()=> ''); setStatus('❌ 연결 실패 ('+resp.status+'): '+b.slice(0,400)); cleanup(); return; }
        await pc.setRemoteDescription({ type:'answer', sdp: await resp.text() });
        els.stop.disabled = false;
      } catch(err){ setStatus('❌ 오류: '+(err&&err.message?err.message:err)); cleanup(); }
    }

    async function compileConfig(key){
      if(turns.length < 2) return;
      const convo = turns.join('\n');
      const cur = (els.cfg.value||'').trim();
      const prompt = '다음은 돌봄 서비스 관리자와 AI 설정 도우미의 대화입니다. 어르신 돌봄 통화 AI(생활지원사)가 따를 "맞춤 설정"을 한국어로 작성하세요. '+
        '항목별 불릿으로: [말투/톤], [추임새], [대화 방식], [꼭 안내·확인할 것], [대화 맥락 관리], [상황별 주의]. 기존 설정과 이번 대화를 합쳐 반영하고, 간결하고 명확하게. 설정 본문만 출력하세요.\n\n[기존 설정]\n'+(cur||'(없음)')+'\n\n[이번 대화]\n'+convo;
      try{
        const r = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/json' },
          body: JSON.stringify({ model:'gpt-4o-mini', temperature:0.3, messages:[{role:'user', content:prompt}] }) });
        if(r.ok){ const d=await r.json(); const m=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(m){ const t=m.trim(); els.cfg.value=t; localStorage.setItem(CFG_KEY,t); add('sys','💾 설정을 저장했습니다. 어르신 통화에 반영됩니다.'); return; } }
      }catch{}
      // 실패 시: 기존 설정 유지(직접 저장 안내)
      add('sys','⚠️ 자동 정리에 실패했어요. 설정 칸을 직접 확인/수정 후 [설정 저장]을 눌러주세요.');
    }

    function cleanup(){ try{if(dc)dc.close();}catch{} try{if(pc)pc.close();}catch{} try{if(micStream)micStream.getTracks().forEach(t=>t.stop());}catch{} pc=dc=micStream=null; els.start.disabled=false; els.stop.disabled=true; }
    async function stop(){ const key=els.key.value.trim(); setStatus('설정을 정리·저장하는 중...'); cleanup(); await compileConfig(key); setStatus('■ 설정을 마쳤습니다. 어르신 통화에서 적용됩니다.'); }
    els.start.onclick = start; els.stop.onclick = ()=>{ ending=true; stop(); };
  </script>
</body>
</html>
