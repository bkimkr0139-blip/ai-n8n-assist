<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>💚 어르신 돌봄 상담</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         max-width: 640px; margin: 0 auto; padding: 22px; background: #fdf6ee; color: #2b2b2b; }
  h1 { font-size: 1.7rem; color: #2e7d52; margin: 6px 0 2px; }
  .sub { color: #6b6b6b; font-size: 1rem; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid #ead9c5; border-radius: 16px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  input, select { font-size: 1.05rem; padding: 11px; border-radius: 10px; border: 1px solid #cfcfcf; }
  input { width: 100%; }
  .bigbtn { width: 100%; font-size: 1.5rem; font-weight: 800; padding: 22px; border-radius: 18px; border: none; color: #fff; background: #2e7d52; cursor: pointer; margin-top: 10px; }
  .bigbtn.stop { background: #b3433a; }
  .bigbtn:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #status { font-size: 1.15rem; padding: 14px; border-radius: 12px; background: #eef6f0; margin: 12px 0; text-align: center; word-break: break-all; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 15px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; line-height: 1.5; font-size: 1.15rem; }
  .me { align-self: flex-end; background: #dbeafe; }
  .ai { align-self: flex-start; background: #e9f5ee; }
  .sys { align-self: center; background: #f3ece1; font-size: .95rem; color: #6b6b6b; }
  .memrow { font-size: .9rem; color: #6b6b6b; display: flex; justify-content: space-between; align-items: center; }
  .small { font-size: .9rem; padding: 8px 12px; border-radius: 10px; border: 1px solid #cfcfcf; background: #fff; cursor: pointer; }
  label { font-size: .95rem; color: #44505f; }
  details { font-size: .92rem; color: #555; }
</style>
</head>
<body>
  <h1>💚 어르신 돌봄 상담</h1>
  <div class="sub">밝고 친절한 생활지원사와 음성으로 안부를 나눠요. 버튼을 누르고 편하게 말씀하세요.</div>

  <div class="card">
    <input id="key" type="password" placeholder="OpenAI API Key (sk-...) — 처음 한 번만" autocomplete="off" />
    <div class="row" style="margin-top:10px">
      <label>담당 생활지원사</label>
      <input id="worker" style="flex:1;min-width:120px" placeholder="예: 김지원" />
      <label>거주지역</label>
      <input id="region" style="flex:1;min-width:120px" placeholder="예: 서울" />
      <label>목소리</label>
      <select id="voice">
        <option value="shimmer">shimmer (밝은 여성)</option>
        <option value="coral">coral (따뜻한 여성)</option>
        <option value="sage">sage (차분한 여성)</option>
        <option value="alloy">alloy (중성)</option>
      </select>
      <label>속도</label>
      <select id="speed"><option value="1.0">보통</option><option value="1.15" selected>조금 빠름</option><option value="1.3">빠름</option></select>
      <label>소음환경</label>
      <select id="env"><option value="quiet">조용한 방</option><option value="normal" selected>보통</option><option value="noisy">TV·소음 많음</option></select>
    </div>
    <button id="start" class="bigbtn">▶ 통화 시작</button>
    <button id="stop" class="bigbtn stop" disabled>■ 통화 끝내기</button>
  </div>

  <div id="status">대기 중 — API 키 입력 후 [통화 시작]</div>

  <div class="card">
    <div class="memrow"><span id="memstate">📓 이전 기록: 확인 중…</span><button id="clearmem" class="small">기억 지우기</button></div>
    <details id="memdetails" style="margin-top:8px"><summary>저장된 어르신 메모 보기</summary><div id="memtext" style="white-space:pre-wrap;margin-top:8px"></div></details>
  </div>

  <div id="log"></div>
  <audio id="audio" autoplay></audio>

  <script>
    const MODEL = 'gpt-realtime';
    const CALLS_URL = 'https://api.openai.com/v1/realtime/calls';
    const MEM_KEY = 'care_memory_v1';
    const CFG_KEY = 'care_config';
    const REGION_KEY = 'care_region';

    const PERSONA =
      '당신은 어르신을 돌보는 30~40대의 밝고 친절한 여성 생활지원사(돌봄 종사자)입니다. ' +
      '목소리는 환하고 다정하며, 너무 느리지 않게 경쾌하고 또렷한 속도로 말합니다. 항상 정중한 존댓말을 씁니다. ' +
      '어르신의 안부(식사, 수면, 건강, 통증, 약 복용, 기분, 외로움)를 한 번에 하나씩 자연스럽게 여쭙고, 밝게 공감하며 경청합니다. ' +
      '짧고 쉬운 문장으로 대화하듯 말하고, 날씨·가족·옛이야기 같은 즐거운 여담도 곁들입니다. ' +
      '걱정되는 점(건강 악화, 우울, 위급 신호)이 있으면 부드럽게 더 여쭤보고 안심시키되, 의료 진단·처방은 하지 말고 ' +
      '필요하면 가족이나 담당 선생님께 알리시도록 권합니다. 답변은 1~2문장으로 짧고 경쾌하게, 즉시 대답합니다. ' +
      '어르신이 통화를 마치고 싶어 하시면(예: 그만/끊을게/이만/들어가볼게/수고했어요) 길게 붙잡지 말고 ' +
      '밝고 따뜻하게 짧은 작별 인사만 드리고 마무리합니다. ' +
      '주변 TV·라디오·다른 사람 말소리나 잡음에는 반응하지 마세요. 어르신이 당신에게 또렷이 말을 걸 때만 답하고, 입력이 불분명하거나 대화 상대를 향한 말이 아닌 것 같으면 답하지 말고 조용히 기다리세요. 당신(AI) 자신의 말소리에는 절대 반응하지 마세요. ' +
      '날씨 등 도구로 정보를 찾을 때는 도구를 호출하기 직전에 반드시 "네, 잠시만요. 바로 찾아볼게요" 또는 "네, 잠깐만요" 같은 짧은 말을 먼저 한 뒤 도구를 호출하세요. 그래야 찾는 동안 어색한 침묵이 없습니다. 결과가 오면 자연스럽게 이어서 답하세요.';

    const WORKER_KEY = 'care_worker';
    const PURPOSE = (new URLSearchParams(location.search).get('purpose') || new URLSearchParams(location.search).get('p') || '').trim();
    const $ = (id) => document.getElementById(id);
    const els = { key:$('key'), worker:$('worker'), region:$('region'), voice:$('voice'), speed:$('speed'), env:$('env'), start:$('start'), stop:$('stop'), status:$('status'),
                  log:$('log'), audio:$('audio'), memstate:$('memstate'), memtext:$('memtext'), clearmem:$('clearmem') };
    const ENV = { quiet:{nr:'near_field',th:0.45}, normal:{nr:'far_field',th:0.55}, noisy:{nr:'far_field',th:0.72} };
    els.key.value = localStorage.getItem('oai_key') || '';
    els.env.value = localStorage.getItem('care_env') || 'normal';
    els.env.onchange = ()=> localStorage.setItem('care_env', els.env.value);
    els.worker.value = localStorage.getItem(WORKER_KEY) || '';
    els.worker.onchange = ()=> localStorage.setItem(WORKER_KEY, (els.worker.value||'').trim());
    els.region.value = localStorage.getItem(REGION_KEY) || '서울';
    els.region.onchange = ()=> localStorage.setItem(REGION_KEY, (els.region.value||'서울').trim());

    let pc=null, dc=null, micStream=null, aiBuf='', turns=[], pastMem='', endRequested=false, ending=false;
    const setStatus = (s)=> els.status.textContent = s;
    function add(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; els.log.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'end'}); }
    function loadMem(){ try { return localStorage.getItem(MEM_KEY)||''; } catch { return ''; } }
    function saveMem(t){ try { localStorage.setItem(MEM_KEY, t); } catch {} ; refreshMemUI(); }
    function refreshMemUI(){ const m=loadMem(); els.memstate.textContent = m ? '📓 이전 통화 기록 있음 (다음 통화에 반영됩니다)' : '📓 이전 기록 없음 (첫 통화)'; els.memtext.textContent = m || '(없음)'; }
    refreshMemUI();
    els.clearmem.onclick = ()=>{ if(confirm('저장된 어르신 메모를 지울까요?')){ try{localStorage.removeItem(MEM_KEY);}catch{}; refreshMemUI(); } };

    // ===== 날씨 (Open-Meteo, 무료/키 불필요/CORS 허용) =====
    const CITY = {'서울':'Seoul','부산':'Busan','대구':'Daegu','인천':'Incheon','광주':'Gwangju','대전':'Daejeon','울산':'Ulsan','세종':'Sejong',
      '수원':'Suwon','성남':'Seongnam','고양':'Goyang','용인':'Yongin','부천':'Bucheon','안산':'Ansan','안양':'Anyang','평택':'Pyeongtaek','의정부':'Uijeongbu',
      '춘천':'Chuncheon','강릉':'Gangneung','원주':'Wonju','청주':'Cheongju','충주':'Chungju','천안':'Cheonan','아산':'Asan',
      '전주':'Jeonju','익산':'Iksan','목포':'Mokpo','여수':'Yeosu','순천':'Suncheon','포항':'Pohang','경주':'Gyeongju','구미':'Gumi',
      '창원':'Changwon','진주':'Jinju','김해':'Gimhae','제주':'Jeju','서귀포':'Seogwipo',
      '경기':'Suwon','강원':'Chuncheon','충북':'Cheongju','충남':'Cheonan','전북':'Jeonju','전남':'Mokpo','경북':'Pohang','경남':'Changwon'};
    function toEn(loc){ const k=(loc||'').trim().replace(/(특별시|광역시|특별자치시|특별자치도|광역자치|자치도|자치시|시|도|군|구|지역)$/,''); return CITY[loc&&loc.trim()] || CITY[k] || (loc||'').trim(); }
    function wko(c){ if(c===0)return'맑음'; if(c<=2)return'대체로 맑음'; if(c===3)return'흐림'; if(c<=48)return'안개'; if(c<=57)return'이슬비'; if(c<=67)return'비'; if(c<=77)return'눈'; if(c<=82)return'소나기'; if(c<=86)return'눈 소나기'; return'천둥번개'; }
    async function getWeather(loc){
      const region = (loc && loc.trim()) ? loc.trim() : (els.region.value||'서울').trim();
      const q = toEn(region);
      try{
        const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ko&name='+encodeURIComponent(q))).json();
        if(!g.results || !g.results.length) return region+' 날씨 정보를 찾지 못했어요.';
        const r0=g.results[0];
        const w = await (await fetch('https://api.open-meteo.com/v1/forecast?timezone=Asia%2FSeoul&forecast_days=1&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&latitude='+r0.latitude+'&longitude='+r0.longitude)).json();
        const c=w.current, d=w.daily;
        return region+' 현재 '+Math.round(c.temperature_2m)+'도, '+wko(c.weather_code)+'. 오늘 최고 '+Math.round(d.temperature_2m_max[0])+'도 최저 '+Math.round(d.temperature_2m_min[0])+'도, 강수확률 '+d.precipitation_probability_max[0]+'%.';
      }catch(e){ return region+' 날씨를 가져오지 못했어요.'; }
    }
    function weatherTool(){ return { type:'function', name:'get_weather',
      description:'특정 지역의 현재 날씨와 오늘 예보를 가져온다. 어르신이 지역을 말하지 않으면 location을 비워두면 거주지역으로 조회한다. 이 도구를 호출하기 직전에 먼저 "네, 잠시만요. 찾아볼게요"라고 짧게 말할 것.',
      parameters:{ type:'object', properties:{ location:{ type:'string', description:'도시명. 가능하면 영문(예: Seoul, Busan). 어르신 거주지역이면 비워둠.' } }, required:[] } }; }
    async function getNews(topic){
      const base=(topic&&topic.trim())
        ? 'https://news.google.com/rss/search?q='+encodeURIComponent(topic.trim())+'&hl=ko&gl=KR&ceid=KR:ko'
        : 'https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko';
      try{
        const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(base));
        const xml=await r.text();
        const doc=new DOMParser().parseFromString(xml,'text/xml');
        let items=Array.from(doc.querySelectorAll('item > title')).map(t=>(t.textContent||'').trim()).filter(Boolean).slice(0,5);
        if(!items.length) return '지금은 뉴스를 가져오지 못했어요.';
        return items.map((t,i)=>(i+1)+'. '+t).join('\n');
      }catch(e){ return '지금은 뉴스를 가져오지 못했어요.'; }
    }
    function newsTool(){ return { type:'function', name:'get_news',
      description:'오늘의 주요 뉴스 헤드라인을 가져온다. topic을 주면 그 주제 뉴스, 없으면 전체 헤드라인. 호출 직전 "네, 제가 한번 찾아볼게요"라고 짧게 말할 것. 결과가 오면 헤드라인 2~4개만 골라 자연스럽게 요약해 읽어주고, 언론사명·기호·따옴표는 생략하라.',
      parameters:{ type:'object', properties:{ topic:{ type:'string', description:'뉴스 주제(선택). 예: 건강, 날씨, 정치. 없으면 전체.' } }, required:[] } }; }

    const END_WORDS = ['끊','그만','이만','들어가','안녕히','수고했','수고하','잘 있','다음에 봐'];
    function isEndIntent(t){ return END_WORDS.some(w => t.indexOf(w) >= 0); }

    function buildInstructions(){
      pastMem = loadMem();
      const region = (els.region.value||'서울').trim();
      let ins = PERSONA;
      ins += '\n\n[어르신 거주지역] '+region+'. 날씨를 여쭤보시면 get_weather 도구를 쓰세요. 지역을 따로 안 말씀하시면 거주지역('+region+')으로, 다른 지역을 말씀하시면 그 지역으로 조회하고, 결과를 다정하게 대화에 녹여 알려드리세요(예보 수치를 그대로 읽기보다 자연스럽게).';
      const cfg = (localStorage.getItem(CFG_KEY) || '').trim();
      if (cfg) ins += '\n\n[관리자 맞춤 설정 — 아래 지침을 최우선으로 따르세요]\n' + cfg;
      const worker = (els.worker.value||'').trim();
      ins += '\n\n[통화 시작 인사] 가장 먼저 공손히 인사하세요: "어르신, 안녕하세요. 저는 생활지원사 ' + (worker || '') + '입니다." (담당자 이름이 비어 있으면 "저는 생활지원사입니다"). 그런 다음 아래 용건을 말하세요.';
      if (PURPOSE === 'med') {
        ins += '\n[오늘 용건] 복약 안내 전화입니다. 약 드실 시간이 되어 연락드렸다고 따뜻하게 말하고, 약을 드셨는지 여쭤본 뒤 아직이면 지금 천천히 드시도록 다정하게 안내·확인하세요. 물도 한 잔 곁들이시도록 권하세요. 그 뒤 짧게 안부도 여쭤보세요.';
        let meds=''; try{ const ms=JSON.parse(localStorage.getItem('med_schedule')||'[]'); if(ms.length) meds=ms.map(m=>'- '+(m.time||'')+' '+(m.when||'')+': '+(m.med||'')).join('\n'); }catch(e){}
        if(meds) ins += '\n[복약 일정]\n'+meds+'\n지금 시간대에 해당하는 약을 콕 집어 안내하세요(예: 아침 식후 치매약). 시간이 안 맞는 약까지 굳이 다 읽지는 마세요.';
      }
      else ins += '\n[오늘 용건] 안부 확인입니다. 식사·수면·기분·건강을 자연스럽게 여쭤보세요.';
      if (pastMem) ins += '\n\n[이 어르신과의 이전 통화 메모]\n' + pastMem + '\n인사와 용건 뒤, 위 메모에서 한 가지를 콕 집어 안부를 이어가세요(메모를 그대로 읽지 말고 대화에 녹이세요).';
      return ins;
    }
    function sessionConfig(){
      return { type:'session.update', session:{ type:'realtime', instructions: buildInstructions(),
        tools:[ weatherTool(), newsTool() ], tool_choice:'auto',
        audio:{ input:{ transcription:{ model:'whisper-1' }, noise_reduction:{ type:(ENV[els.env.value]||ENV.normal).nr }, turn_detection:{ type:'server_vad', threshold:(ENV[els.env.value]||ENV.normal).th, prefix_padding_ms:200, silence_duration_ms:500 } },
                output:{ voice: els.voice.value, speed: parseFloat(els.speed.value) } } } };
    }

    async function handleFunctionCall(item){
      let args={}; try{ args=JSON.parse(item.arguments||'{}'); }catch{}
      let out='';
      if(item.name==='get_weather'){ setStatus('🌤️ 날씨 확인 중...'); out = await getWeather(args.location); add('sys','🌤️ '+out); }
      else if(item.name==='get_news'){ setStatus('📰 뉴스 확인 중...'); out = await getNews(args.topic); add('sys','📰 '+out); }
      else out = '지원하지 않는 기능입니다.';
      try{ dc.send(JSON.stringify({ type:'conversation.item.create', item:{ type:'function_call_output', call_id:item.call_id, output: out } })); dc.send(JSON.stringify({ type:'response.create' })); }catch{}
    }

    async function start(){
      const key = els.key.value.trim();
      if(!key){ alert('OpenAI API Key를 입력해 주세요.'); return; }
      localStorage.setItem('oai_key', key); localStorage.setItem(REGION_KEY, (els.region.value||'서울').trim());
      els.start.disabled = true; turns = []; endRequested=false; ending=false;
      try { setStatus('🎤 마이크 권한을 허용해 주세요...'); micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } }); }
      catch(e){ setStatus('❌ 마이크 권한이 거부되었습니다.'); els.start.disabled=false; return; }
      pc = new RTCPeerConnection();
      pc.ontrack = (e)=> els.audio.srcObject = e.streams[0];
      micStream.getTracks().forEach(t=> pc.addTrack(t, micStream));
      dc = pc.createDataChannel('oai-events');
      dc.onopen = ()=>{ setStatus('🟢 연결됐어요 — 편하게 말씀하세요'); try{ dc.send(JSON.stringify(sessionConfig())); }catch{}; try{ dc.send(JSON.stringify({type:'response.create'})); }catch{}; add('sys', pastMem ? '이전 대화를 기억하고 있어요. 안부를 나눠요.' : '첫 통화예요. 밝게 인사드릴게요.'); };
      dc.onmessage = (e)=>{ let ev; try{ ev=JSON.parse(e.data); }catch{ return; } const t=ev.type||'';
        if(t==='response.output_item.done' && ev.item && ev.item.type==='function_call'){ handleFunctionCall(ev.item); return; }
        if(t.indexOf('input_audio_transcription')>=0 && t.endsWith('.completed')){ if(ev.transcript){ const s=ev.transcript.trim(); add('me','🗣️ '+s); turns.push('어르신: '+s); if(isEndIntent(s)) endRequested=true; } }
        else if(t.endsWith('audio_transcript.delta')){ aiBuf += (ev.delta||''); }
        else if(t.endsWith('audio_transcript.done')){ const s=(ev.transcript||aiBuf).trim(); if(s){ add('ai','💚 '+s); turns.push('도우미: '+s); } aiBuf='';
          if(endRequested && !ending){ ending=true; setStatus('통화를 마무리하는 중이에요...'); setTimeout(()=>stop(), Math.max(2500, s.length*130)); } }
        else if(t==='error'){ add('sys','⚠️ '+JSON.stringify(ev.error||ev)); }
      };
      pc.onconnectionstatechange = ()=>{ if(['failed','disconnected','closed'].includes(pc.connectionState) && !ending) setStatus('통화가 종료되었어요 ('+pc.connectionState+')'); };
      try{
        const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
        setStatus('연결 중입니다...');
        const resp = await fetch(CALLS_URL+'?model='+encodeURIComponent(MODEL), { method:'POST', body:offer.sdp, headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/sdp' } });
        if(!resp.ok){ const b=await resp.text().catch(()=> ''); setStatus('❌ 연결 실패 ('+resp.status+'): '+b.slice(0,400)); cleanup(); return; }
        await pc.setRemoteDescription({ type:'answer', sdp: await resp.text() });
        els.stop.disabled = false;
      } catch(err){ setStatus('❌ 오류: '+(err&&err.message?err.message:err)); cleanup(); }
    }

    async function updateMemory(key){
      if(turns.length < 2) return;
      const convo = turns.join('\n');
      const prompt = '다음은 돌봄 도우미와 어르신의 통화 내용입니다. 다음 통화 때 참고할 "어르신 메모"를 한국어로 갱신해 주세요. '+
        '기존 메모와 이번 통화를 합쳐서, 어르신 호칭/성함, 건강상태와 통증, 기분, 가족/일상, 걱정거리, 약속한 것, 다음에 여쭤볼 것을 간결한 불릿으로 12줄 이내로 정리하세요. 메모만 출력하세요.\n\n[기존 메모]\n'+(pastMem||'(없음)')+'\n\n[이번 통화]\n'+convo;
      try{
        const r = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/json' },
          body: JSON.stringify({ model:'gpt-4o-mini', temperature:0.3, messages:[{role:'user', content:prompt}] }) });
        if(r.ok){ const d=await r.json(); const m=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(m){ saveMem(m.trim()); add('sys','📓 이번 대화를 기억에 저장했어요.'); return; } }
      }catch{}
      saveMem((pastMem? pastMem+'\n':'')+ '[최근통화]\n'+ turns.slice(-12).join('\n'));
    }

    function cleanup(){ try{if(dc)dc.close();}catch{} try{if(pc)pc.close();}catch{} try{if(micStream)micStream.getTracks().forEach(t=>t.stop());}catch{} pc=dc=micStream=null; els.start.disabled=false; els.stop.disabled=true; }
    async function stop(){ const key=els.key.value.trim(); setStatus('통화를 정리하고 기억에 저장하는 중...'); cleanup(); await updateMemory(key); setStatus('■ 통화가 끝났어요. 수고하셨습니다.'); }
    els.start.onclick = start; els.stop.onclick = ()=>{ ending=true; stop(); };
  </script>
</body>
