<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎙️ 실시간 음성 비서</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 720px;
         margin: 0 auto; padding: 24px; background: #0f1115; color: #e7e9ee; }
  h1 { font-size: 1.4rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  input, select, button { font-size: 1rem; padding: 10px 12px; border-radius: 10px;
         border: 1px solid #333; background: #1a1d24; color: #e7e9ee; }
  input { flex: 1; min-width: 220px; }
  button { cursor: pointer; border-color: #2a6; background: #163; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  #stop { border-color: #a33; background: #611; }
  #status { padding: 10px 12px; border-radius: 10px; background: #1a1d24; margin: 12px 0; word-break: break-all; }
  #log { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .msg { padding: 10px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
  .me { align-self: flex-end; background: #1f3a5f; }
  .ai { align-self: flex-start; background: #23303a; }
  .sys { align-self: center; background: #2a2333; font-size: .85rem; opacity: .85; }
  .hint { font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
  <h1>🎙️ 실시간 음성 비서 (OpenAI Realtime)</h1>
  <p class="hint">마이크를 계속 누르지 않아도, 말하면 자동으로 알아듣고 음성으로 답합니다(서버 VAD).</p>

  <div class="row">
    <input id="key" type="password" placeholder="OpenAI API Key (sk-...)" autocomplete="off" />
  </div>
  <div class="row">
    <label>목소리</label>
    <select id="voice">
      <option value="alloy">alloy</option>
      <option value="ash">ash</option>
      <option value="ballad">ballad</option>
      <option value="coral">coral</option>
      <option value="echo">echo</option>
      <option value="sage">sage</option>
      <option value="shimmer">shimmer</option>
      <option value="verse">verse</option>
      <option value="marin">marin</option>
      <option value="cedar">cedar</option>
    </select>
    <button id="start">▶ 음성 대화 시작</button>
    <button id="stop" disabled>■ 중지</button>
  </div>

  <div id="status">대기 중 — API 키 입력 후 [음성 대화 시작]</div>
  <div id="log"></div>
  <audio id="audio" autoplay></audio>

  <script>
    // 모델/엔드포인트 (GA Realtime). 필요시 여기만 바꾸면 됨.
    const MODEL = 'gpt-realtime';
    const CALLS_URL = 'https://api.openai.com/v1/realtime/calls';
    const INSTRUCTIONS =
      '당신은 BC Kim의 한국어 개인 비서입니다. 항상 한국어로, 짧고 자연스러운 구어체로 대화하세요. 답은 1~3문장으로 간결하게.';

    const $ = (id) => document.getElementById(id);
    const els = { key: $('key'), voice: $('voice'), start: $('start'), stop: $('stop'),
                  status: $('status'), log: $('log'), audio: $('audio') };
    els.key.value = localStorage.getItem('oai_key') || '';
    let pc = null, dc = null, micStream = null, aiBuf = '';

    const setStatus = (s) => { els.status.textContent = s; };
    function add(cls, text) {
      const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
      els.log.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    function sessionConfig() {
      return { type: 'session.update', session: {
        type: 'realtime',
        instructions: INSTRUCTIONS,
        audio: {
          input: { transcription: { model: 'whisper-1' }, turn_detection: { type: 'server_vad' } },
          output: { voice: els.voice.value }
        }
      } };
    }

    async function start() {
      const key = els.key.value.trim();
      if (!key) { alert('OpenAI API Key를 입력하세요.'); return; }
      localStorage.setItem('oai_key', key);
      els.start.disabled = true;

      try { setStatus('마이크 권한 요청 중...'); micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { setStatus('❌ 마이크 권한 거부됨. 브라우저 설정에서 허용하세요.'); els.start.disabled = false; return; }

      pc = new RTCPeerConnection();
      pc.ontrack = (e) => { els.audio.srcObject = e.streams[0]; };
      micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));

      dc = pc.createDataChannel('oai-events');
      dc.onopen = () => { setStatus('🟢 연결됨 — 그냥 말씀하세요 (마이크 누를 필요 없음)');
        try { dc.send(JSON.stringify(sessionConfig())); } catch {} ; add('sys', '대화를 시작합니다. 편하게 말씀하세요.'); };
      dc.onmessage = (e) => {
        let ev; try { ev = JSON.parse(e.data); } catch { return; }
        const t = ev.type || '';
        if (t.indexOf('input_audio_transcription') >= 0 && t.endsWith('.completed')) { if (ev.transcript) add('me', '🗣️ ' + ev.transcript.trim()); }
        else if (t.endsWith('audio_transcript.delta')) { aiBuf += (ev.delta || ''); }
        else if (t.endsWith('audio_transcript.done')) { add('ai', '🤖 ' + (ev.transcript || aiBuf).trim()); aiBuf = ''; }
        else if (t === 'error') { add('sys', '⚠️ ' + JSON.stringify(ev.error || ev)); }
      };
      pc.onconnectionstatechange = () => {
        if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) setStatus('연결 종료됨 (' + pc.connectionState + ')');
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        setStatus('OpenAI Realtime 연결 중...');
        const resp = await fetch(CALLS_URL + '?model=' + encodeURIComponent(MODEL), {
          method: 'POST', body: offer.sdp,
          headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/sdp' }
        });
        if (!resp.ok) {
          const body = await resp.text().catch(() => '');
          setStatus('❌ 연결 실패 (' + resp.status + '): ' + body.slice(0, 400));
          cleanup(); return;
        }
        await pc.setRemoteDescription({ type: 'answer', sdp: await resp.text() });
        els.stop.disabled = false;
      } catch (err) { setStatus('❌ 오류: ' + (err && err.message ? err.message : err)); cleanup(); }
    }

    function cleanup() {
      try { if (dc) dc.close(); } catch {}
      try { if (pc) pc.close(); } catch {}
      try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch {}
      pc = dc = micStream = null; els.start.disabled = false; els.stop.disabled = true;
    }
    function stop() { cleanup(); setStatus('■ 중지됨'); }
    els.start.onclick = start; els.stop.onclick = stop;
  </script>
</body>
</html>
