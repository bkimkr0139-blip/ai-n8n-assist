<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3d91" />
<title>✈️ 서울항공화물 CS 음성상담 (데모)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ color-scheme: light; --bg-1:#eef2f9; --bg-2:#e2e9f5; --surface:#fff; --line:#d7deec;
    --primary:#0b3d91; --primary-2:#134fb4; --primary-strong:#082a66; --danger:#b3433a; --txt:#1c2128; --mut:#6b6f78;
    --r-md:14px; --r-lg:20px; --r-xl:28px; --shadow-md:0 6px 18px rgba(11,61,145,.10); --shadow-lg:0 16px 44px rgba(11,61,145,.16); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif; color:var(--txt);
    background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%); min-height:100vh; }
  .wrap{ max-width:680px; margin:0 auto; padding:18px 18px 64px; }
  .hero{ background:linear-gradient(135deg,#082a66 0%,#0b3d91 55%,#134fb4 100%); color:#fff; border-radius:var(--r-xl);
    padding:26px 22px; box-shadow:var(--shadow-lg); margin-bottom:18px; }
  .hero h1{ font-size:1.5rem; font-weight:800; margin:0; }
  .hero .sub{ color:rgba(255,255,255,.9); font-size:.95rem; margin-top:6px; line-height:1.5; }
  .hero .meta{ margin-top:12px; font-size:.85rem; color:rgba(255,255,255,.85); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin:14px 0; box-shadow:var(--shadow-md); }
  .bigbtn{ width:100%; font-size:1.25rem; font-weight:800; padding:18px; border-radius:var(--r-md); border:0; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,var(--primary-2) 0%,var(--primary) 100%); margin-top:8px; }
  .bigbtn.stop{ background:linear-gradient(180deg,#c75a51 0%,var(--danger) 100%); }
  .bigbtn:disabled{ opacity:.4; cursor:not-allowed; }
  #status{ font-size:1.02rem; padding:14px 16px; border-radius:var(--r-md); background:#eaf0fc; border:1px solid #cfdcf5;
    margin:14px 0; text-align:center; color:var(--primary-strong); font-weight:600; }
  #log{ display:flex; flex-direction:column; gap:10px; }
  .msg{ padding:12px 15px; border-radius:16px; max-width:88%; white-space:pre-wrap; line-height:1.5; font-size:1.02rem; }
  .me{ align-self:flex-end; background:#e9f1ff; color:#1d3a6a; }
  .ai{ align-self:flex-start; background:#eaf6ee; color:#155831; }
  .sys{ align-self:center; background:#f5edde; border:1px dashed var(--line); font-size:.88rem; color:var(--mut); border-radius:14px; padding:6px 12px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>✈️ 서울항공화물 AI 상담원</h1>
    <div class="sub">항공화물 CS 음성상담 데모 — 버튼을 누르고 편하게 말씀하세요.</div>
    <div class="meta" id="caseMeta"></div>
  </header>

  <div class="card">
    <button id="start" class="bigbtn">▶ 상담 시작</button>
    <button id="stop" class="bigbtn stop" disabled>■ 상담 종료</button>
  </div>

  <div id="status">대기 중 — [상담 시작]을 누르세요</div>
  <div id="log"></div>
  <audio id="audio" autoplay></audio>
</div>

<script>
  const MODEL = 'gpt-realtime';
  const CALLS_URL = 'https://api.openai.com/v1/realtime/calls';
  const N8N_BASE = 'https://bc.wizbase.ai.kr/webhook';
  const TOKEN_URL = N8N_BASE + '/cs-realtime-token';
  const CALL_COMPLETED_URL = N8N_BASE + '/scargo-voice/call-completed';
  // 텔레그램 등 인앱 브라우저는 마이크(getUserMedia)를 막는 경우가 많아, 열리자마자 실제 Chrome으로 강제 이동.
  // Android: intent:// 로 OS 인텐트 리졸버를 거쳐 Chrome을 직접 호출(인앱 브라우저를 우회). iOS: Chrome 커스텀 스킴.
  // ponytail: iOS는 Chrome 미설치 시 아무 동작 없음(대체 브라우저 강제 방법이 OS 레벨에서 없음) — 재귀 방지는 forced=1 플래그.
  (function () {
    try {
      var qs0 = new URLSearchParams(location.search);
      if (qs0.get('forced') === '1') return;
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      if (!isAndroid && !isIOS) return;
      qs0.set('forced', '1');
      var target = location.origin + location.pathname + '?' + qs0.toString();
      if (isAndroid) {
        var noScheme = target.replace(/^https?:\/\//, '');
        location.href = 'intent://' + noScheme + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(target) + ';end';
      } else {
        location.href = target.replace(/^https:\/\//, 'googlechromes://').replace(/^http:\/\//, 'googlechrome://');
      }
    } catch (e) {}
  })();

  const PASSCODE_KEY = 'cs_cargo_passcode';
  function getPasscode() {
    // 링크에 접속코드가 실려오면(텔레그램 버튼) 최우선 사용 — 수동 입력은 그 경우가 없을 때만 폴백.
    let p = (new URLSearchParams(location.search).get('key') || '').trim();
    if (!p) { try { p = localStorage.getItem(PASSCODE_KEY) || ''; } catch (e) {} }
    if (!p) { p = (prompt('접속 코드를 입력하세요') || '').trim(); }
    try { localStorage.setItem(PASSCODE_KEY, p); } catch (e) {}
    return p;
  }

  const qs = new URLSearchParams(location.search);
  const CASE_ID = (qs.get('case_id') || '').trim();
  const SCRIPT_TYPE = (qs.get('script_type') || '').trim();
  const CAMPAIGN_ID = (qs.get('campaign_id') || '').trim();
  const RECIPIENT_ID = (qs.get('recipient_id') || '').trim();
  const ITEM_IDS = (qs.get('item_ids') || '').split(',').map((s) => s.trim()).filter(Boolean);
  let VARS = {};
  try { VARS = JSON.parse(qs.get('vars') || '{}'); } catch (e) {}

  const SCRIPTS = {
    flight_cancel_notice: (v) => `${v.flight_no ? v.flight_no + '편' : '해당 항공편'}${v.destination ? '(목적지 ' + v.destination + ')' : ''} 결항으로 인한 안내입니다.${v.scheduled_departure_at ? ' 원래 출발 예정일은 ' + v.scheduled_departure_at + '였습니다.' : ''} ` +
      `새로운 예상 도착/처리 일정${v.new_eta ? '(' + v.new_eta + ')' : ''}을 안내하고, 고객의 의견(대체편 희망 여부, 이의 제기, 추가 요청)을 여쭤보세요.`,
    claim_followup: (v) => `접수된 클레임 건에 대한 후속 안내입니다. 처리 현황을 안내하고, 고객이 추가로 전달하고 싶은 내용이나 이견이 있는지 확인하세요.`,
  };
  const hasCase = !!SCRIPTS[SCRIPT_TYPE];
  let scriptText = hasCase ? SCRIPTS[SCRIPT_TYPE](VARS) : '이번 통화는 특정 케이스 없이 진행하는 데모 통화입니다. 결항·클레임 등 실제 사건 내용을 지어내지 말고, 무엇을 도와드릴지 여쭤보는 것으로 시작하세요.';
  // scargo-ax가 보낸 실제 사건 요약(incident.summary)을 최우선으로 앞세운다 — script_type이 계약 enum과
  // 안 맞아 엉뚱한 템플릿(SCRIPTS)이 골라지더라도, 실제 상황 설명만큼은 항상 전달되게 하는 안전장치.
  if (VARS.summary) scriptText = VARS.summary + '. ' + scriptText;

  document.getElementById('caseMeta').textContent = CASE_ID ? ('케이스 ' + CASE_ID + (SCRIPT_TYPE ? ' · ' + SCRIPT_TYPE : '')) : '(데모 — 케이스 없이 자유 대화)';

  const PERSONA =
    '[언어] 모든 대화는 한국어 정중한 격식체로만 말하세요. ' +
    '당신은 "서울항공화물" CS 상담원입니다. 항공화물(포워딩) 업무를 다루며, AWB(항공화물운송장)·결항·ETA(도착예정시각)·클레임 같은 용어를 정확히 씁니다. ' +
    '목소리는 침착하고 신뢰감 있게, 신속·정확을 우선합니다. 불필요한 잡담은 피하고 목적 지향적으로 진행하세요: (1) 용건을 명확히 전달 → (2) 고객의 확인/이견/요청을 경청 → (3) 필요시 간단히 재확인 → (4) 정중히 마무리. ' +
    '고객이 클레임이나 불만을 제기하면 절대 임의로 보상·환불을 약속하지 말고, "정확히 확인 후 담당자가 다시 연락드리겠습니다"라고 안내하세요. ' +
    '응답은 1~2문장으로 짧고 명확하게 하세요. 고객이 통화를 마치고 싶어하면(그만/끊을게/이만 등) 길게 붙잡지 말고 정중히 마무리하세요. ' +
    '[상담 시작 인사] 가장 먼저, 다른 어떤 말보다 먼저 이렇게 인사하세요: "안녕하세요, 서울항공화물입니다." 그런 다음 바로 이어서 아래 [오늘 용건]을 자연스럽게 전달하세요. 인사 없이 바로 용건이나 다른 이야기로 시작하지 마세요. ' +
    '[금지: 사실 창작] 아래 [오늘 용건]에 적히지 않은 항공편명·날짜·금액·사건 경위 등은 절대 지어내 말하지 마세요. 확실하지 않은 내용은 "확인 후 다시 안내드리겠습니다"라고 답하세요. ' +
    '[배경소음] 주변 TV·라디오·뉴스 방송이나 다른 사람 말소리에는 절대 반응하지 마세요. 마이크에 화자 음역 필터가 걸려 있어 대부분의 TV·타인 목소리는 이미 걸러지지만 완전하진 않습니다. 고객이 당신에게 또렷이 말을 걸 때만 답하세요. 입력이 "여보세요"류 인사말이나 "네/아니요/음..." 같은 짧은 맞장구가 아니면서, 뉴스 앵커 멘트·광고·드라마 대사처럼 화물·배송·항공편 상담과 전혀 무관해 보이면, 그 내용에 절대 답하지 말고 "죄송합니다, 잘 안 들렸어요. 다시 한 번 말씀해 주시겠어요?"라고만 짧게 되물으세요. 무관한 소리를 진짜 고객 발언으로 착각해 엉뚱하게 대답하지 마세요. 당신(AI) 자신의 말소리에도 반응하지 마세요. ' +
    '[중단 응대] 설명 도중 고객이 말을 끊으면, 하던 말은 그 자리에서 멈추고 고객이 방금 한 말에만 정확히 집중하세요. 고객이 질문을 하거나 요청(취소, 이견 제기 등)을 했다면 그것부터 답하고, 하려던 설명은 그 답변이 끝난 뒤 자연스러운 순간에 필요한 만큼만 이어가세요 — 처음부터 반복하거나 원래 문장을 그대로 재개하지 마세요. 고객이 "네", "음", "어" 같은 짧은 맞장구만 했다면 원래 하려던 설명을 이어가도 됩니다. 단, 고객이 방금 아무 말도 하지 않았다면 스스로 판단해서 먼저 말을 덧붙이지 마세요 — 항상 고객의 응답을 들은 뒤에만 다음 말을 하세요.' +
    '\n\n[오늘 용건] ' + scriptText;

  const $ = (id) => document.getElementById(id);
  const els = { start: $('start'), stop: $('stop'), status: $('status'), log: $('log'), audio: $('audio') };
  const setStatus = (s) => els.status.textContent = s;
  function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; els.log.appendChild(d); d.scrollIntoView({ block: 'end' }); }

  let pc = null, dc = null, micStream = null, aiBuf = '', turns = [], greeted = false, greetTimer = null, sessionStartIso = '';
  let silenceTimer = null, noResp = 0, stopTimer = null, stopped = false, ending = false, endRequested = false;
  const SILENCE_MS = 16000, MAX_NORESP = 4; // ponytail: 9초는 너무 빨리 "들리십니까?"가 나와 불편하다는 피드백(2026-09-10) 반영해 상향
  const END_PATTERNS = [/끊\s*(을게|을래|어요?)/, /그만\s*(할게|해요?)/, /이만(\s|$)/, /수고(했|하셨)/, /안녕히\s*(계세|가세)/, /\b(bye|goodbye|hang\s*up)\b/i];
  const isEndIntent = (t) => END_PATTERNS.some((re) => re.test((t || '').trim()));
  // ponytail: Whisper가 무음/배경소음 구간에서 지어내는 한국어 환각 패턴(뉴스 앵커 멘트 등) — 알려진 고정 문구만 걸러내는 화면표시용 필터.
  const HALLUCINATION_PATTERNS = [/mbc|sbs|kbs\d?|jtbc|ytn|채널\s*a|연합뉴스/i, /뉴스\s*(입니다|였습니다)/, /기자\s*(입니다|였습니다)/, /앵커\s*(입니다|였습니다)/, /구독과\s*좋아요/, /시청해\s*주셔서\s*감사/];
  const isHallucination = (t) => HALLUCINATION_PATTERNS.some((re) => re.test((t || '').trim()));

  // ===== 화자 음성 학습 + 필터 (피치 기반 게이트, care.html에서 이식) =====
  // 통화 시작 직후 상대방(화주 담당자) 목소리의 음높이(F0) 범위를 학습→기억하고, OpenAI로 보내기 전
  // GainNode로 그 음역과 다른 TV·타인 목소리를 음소거(게이트)해 AI가 반응하지 않게 한다.
  // care.html과 달리 매 통화 상대가 다르므로 localStorage에 저장하지 않고 세션마다 새로 학습한다.
  // ponytail: 진짜 화자 생체인식이 아니라 피치 기반 근사 — 음역이 비슷한 목소리는 구분 못 할 수 있음.
  let audioCtx = null, vfSource = null, vfAnalyser = null, vfGate = null, vfDest = null, vfTimer = null, vfBuf = null;
  let voiceLo = 0, voiceHi = 0, learnSamples = [], learnUntil = 0, learnStart = 0, gateOpen = true;
  function estimatePitch(buf, sr) {
    let rms = 0; for (let i = 0; i < buf.length; i++) { rms += buf[i] * buf[i]; } rms = Math.sqrt(rms / buf.length);
    if (rms < 0.01) return 0;
    const minP = Math.floor(sr / 400), maxP = Math.floor(sr / 70); let best = 0, bestOff = -1;
    for (let off = minP; off <= maxP; off++) { let s = 0; for (let i = 0; i < buf.length - off; i += 2) { s += buf[i] * buf[i + off]; } if (s > best) { best = s; bestOff = off; } }
    if (bestOff <= 0) return 0; const f0 = sr / bestOff; return (f0 >= 70 && f0 <= 400) ? f0 : 0;
  }
  function lockProfile(force) {
    if (learnSamples.length < 6 && !force) return false;
    const s = learnSamples.slice().sort((a, b) => a - b);
    const med = s[Math.floor(s.length / 2)] || 0;
    let core = s.filter((x) => med && x >= med * 0.65 && x <= med * 1.35);
    if (core.length < 5) { if (!force) return false; core = s; }
    voiceLo = core[Math.floor(core.length * 0.1)]; voiceHi = core[core.length - 1 - Math.floor(core.length * 0.1)];
    if (!voiceLo || !voiceHi) return false;
    if (voiceHi - voiceLo < 40) { const m = (voiceLo + voiceHi) / 2; voiceLo = m - 25; voiceHi = m + 25; }
    add('sys', '🎙️ 상대방 목소리를 학습했어요. 이제 TV·주변 소리는 걸러냅니다.');
    return true;
  }
  function startVoiceFilter() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      try { audioCtx.resume(); } catch (e) {}
      vfSource = audioCtx.createMediaStreamSource(micStream);
      vfAnalyser = audioCtx.createAnalyser(); vfAnalyser.fftSize = 2048; vfBuf = new Float32Array(vfAnalyser.fftSize);
      vfGate = audioCtx.createGain(); vfGate.gain.value = 1;
      vfDest = audioCtx.createMediaStreamDestination();
      vfSource.connect(vfAnalyser);
      vfSource.connect(vfGate); vfGate.connect(vfDest);
      voiceLo = 0; voiceHi = 0; learnSamples = []; gateOpen = true; learnStart = Date.now(); learnUntil = Date.now() + 2500;
      vfTimer = setInterval(() => {
        if (!audioCtx) return;
        vfAnalyser.getFloatTimeDomainData(vfBuf);
        const f0 = estimatePitch(vfBuf, audioCtx.sampleRate);
        let pass = true;
        if (f0 > 0) {
          if (!voiceLo) { learnSamples.push(f0); if (Date.now() > learnUntil && learnSamples.length >= 8) { if (!lockProfile(Date.now() - learnStart > 8000)) learnUntil = Date.now() + 1000; } }
          else { const tol = Math.max(25, (voiceHi - voiceLo) * 0.35); pass = (f0 >= voiceLo - tol && f0 <= voiceHi + tol); }
        } else { pass = gateOpen; }
        gateOpen = pass;
        try { vfGate.gain.setTargetAtTime(pass ? 1 : 0, audioCtx.currentTime, 0.04); } catch (e) { vfGate.gain.value = pass ? 1 : 0; }
      }, 90);
      return vfDest.stream.getAudioTracks()[0];
    } catch (e) { return null; }
  }
  function stopVoiceFilter() { if (vfTimer) { clearInterval(vfTimer); vfTimer = null; } try { if (audioCtx) audioCtx.close(); } catch (e) {} audioCtx = vfSource = vfAnalyser = vfGate = vfDest = null; }

  function sessionConfig() {
    // 돌봄 서비스(care.html) 기본값과 동일하게 맞춤: voice=shimmer, speed=1.15, 소음환경 'normal' 프리셋.
    // create_response:false — VAD가 "발화 끝"만 감지하면(잡음·숨소리 등 실제 내용이 없어도) 서버가 자동으로
    // 다음 응답을 만들어버려 AI가 아무도 안 물었는데 설명을 계속 이어붙이는 문제가 있었음(2026-09-09 실통화 로그
    // 확인). 응답 생성을 클라이언트가 직접 트리거하도록 바꿔, 실제로 유의미한 고객 발화가 전사됐을 때만 응답하게 함.
    // interrupt_response:true는 유지 — 고객이 말을 끊으면(바지인) AI가 하던 말을 즉시 멈추는 동작은 그대로 필요.
    return { type: 'session.update', session: { type: 'realtime', instructions: PERSONA,
      audio: { input: { transcription: { model: 'whisper-1', language: 'ko' }, noise_reduction: { type: 'far_field' }, turn_detection: { type: 'server_vad', threshold: 0.55, prefix_padding_ms: 200, silence_duration_ms: 500, create_response: false, interrupt_response: true } },
                output: { voice: 'shimmer', speed: 1.15 } } } };
  }
  function clearSilence() { if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; } }
  function armSilence() { clearSilence(); if (ending || stopped) return; silenceTimer = setTimeout(onSilence, SILENCE_MS); }
  function scheduleStop(ms) { if (stopTimer) clearTimeout(stopTimer); stopTimer = setTimeout(() => stop(), ms); }
  function sayOnce(instr) { try { dc.send(JSON.stringify({ type: 'response.create', response: { instructions: instr } })); } catch (e) {} }
  function sendGreeting() { if (greeted) return; greeted = true; if (greetTimer) { clearTimeout(greetTimer); greetTimer = null; } try { dc.send(JSON.stringify({ type: 'response.create' })); } catch (e) {} }
  function onSilence() {
    if (ending || stopped) return; clearSilence(); noResp++;
    if (noResp >= MAX_NORESP) { ending = true; setStatus('응답이 없어 상담을 마무리합니다...'); sayOnce('고객님이 계속 응답이 없습니다. "고객님, 통화가 어려우신 것 같아 이만 마치겠습니다. 감사합니다." 라고 정중하고 짧게 인사만 하고 마무리하세요.'); scheduleStop(9000); }
    else { setStatus('고객 응답 대기 중...'); sayOnce('고객님이 잠시 응답이 없습니다. 정중하게 "고객님, 들리십니까?" 하고 짧게 한 번 더 확인하세요.'); }
  }

  // S카고 AX 연계: 통화 종료 시 캠페인 발신 건이면 상담 결과를 서버로 전달(fire-and-forget, 실패해도 UI엔 영향 없음).
  function reportCallCompleted(endedIso) {
    if (!CAMPAIGN_ID) return;
    try {
      fetch(CALL_COMPLETED_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
        campaign_id: CAMPAIGN_ID, recipient_id: RECIPIENT_ID, item_ids: ITEM_IDS,
        case_id: CASE_ID, script_type: SCRIPT_TYPE,
        started_at: sessionStartIso, ended_at: endedIso,
        transcript: turns.slice(),
      }) }).catch(() => {});
    } catch (e) {}
  }

  async function start() {
    els.start.disabled = true; turns = []; ending = false; endRequested = false; stopped = false; greeted = false; noResp = 0;
    sessionStartIso = new Date().toISOString();
    if (greetTimer) { clearTimeout(greetTimer); greetTimer = null; } clearSilence();
    let token = '', tj = null;
    const passcode = getPasscode();
    try { setStatus('🔑 연결 준비 중...'); const tr = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: passcode }) }); if (tr.ok) { tj = await tr.json(); token = (tj && tj.value) || ''; } }
    catch (e) {}
    if (!token) {
      if (tj && tj.error === 'unauthorized') { try { localStorage.removeItem(PASSCODE_KEY); } catch (e) {} }
      setStatus('⛔ ' + ((tj && tj.message) || '연결 토큰을 받지 못했습니다.')); els.start.disabled = false; return;
    }
    try { setStatus('🎤 마이크 권한을 허용해 주세요...'); micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { setStatus('❌ 마이크 권한이 거부되었습니다.'); els.start.disabled = false; return; }
    pc = new RTCPeerConnection();
    pc.ontrack = (e) => els.audio.srcObject = e.streams[0];
    const gatedTrack = startVoiceFilter();
    if (gatedTrack && vfDest) { pc.addTrack(gatedTrack, vfDest.stream); }
    else { micStream.getTracks().forEach((t) => pc.addTrack(t, micStream)); }
    dc = pc.createDataChannel('oai-events');
    dc.onopen = () => { setStatus('🟢 연결됐습니다 — 편하게 말씀하세요'); try { dc.send(JSON.stringify(sessionConfig())); } catch (e) {} greetTimer = setTimeout(sendGreeting, 2500); };
    dc.onmessage = (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch (e2) { return; } const t = ev.type || '';
      if (t === 'session.updated') { sendGreeting(); return; }
      if (t.indexOf('input_audio_transcription') >= 0 && t.endsWith('.completed')) {
        const s = (ev.transcript || '').trim();
        // create_response:false라 서버가 자동으로 응답을 만들지 않음 — 여기서 직접 트리거한다.
        // 전사가 비어있으면(무음/잡음이라 Whisper가 아무것도 못 알아들은 경우) 응답 자체를 만들지 않고 조용히 대기.
        if (!s) return;
        if (isHallucination(s)) { add('sys', '🔇 배경소음으로 판단해 무시했어요: ' + s); return; }
        clearSilence(); noResp = 0; add('me', '🗣️ ' + s); turns.push('고객: ' + s); if (isEndIntent(s)) endRequested = true;
        try { dc.send(JSON.stringify({ type: 'response.create' })); } catch (e) {}
      }
      else if (t.endsWith('audio_transcript.delta')) { aiBuf += (ev.delta || ''); clearSilence(); }
      else if (t.endsWith('audio_transcript.done')) { const s = (ev.transcript || aiBuf).trim(); if (s) { add('ai', '✈️ ' + s); turns.push('상담원: ' + s); } aiBuf = '';
        if (endRequested && !ending) { ending = true; setStatus('상담을 마무리하는 중입니다...'); scheduleStop(Math.max(2000, s.length * 120)); }
        else if (ending) { scheduleStop(Math.max(1500, s.length * 110)); }
        else armSilence(); }
      else if (t === 'error') { const err = ev.error || ev; add('sys', '⚠️ ' + (err.message || JSON.stringify(err))); }
    };
    pc.onconnectionstatechange = () => { if (['failed', 'disconnected', 'closed'].includes(pc.connectionState) && !ending) setStatus('상담이 종료되었습니다 (' + pc.connectionState + ')'); };
    try {
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      setStatus('연결 중입니다...');
      const resp = await fetch(CALLS_URL + '?model=' + encodeURIComponent(MODEL), { method: 'POST', body: offer.sdp, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/sdp' } });
      if (!resp.ok) { const b = await resp.text().catch(() => ''); setStatus('❌ 연결 실패 (' + resp.status + '): ' + b.slice(0, 300)); cleanup(); return; }
      await pc.setRemoteDescription({ type: 'answer', sdp: await resp.text() });
      els.stop.disabled = false;
    } catch (err) { setStatus('❌ 오류: ' + (err && err.message ? err.message : err)); cleanup(); }
  }
  function cleanup() { clearSilence(); stopVoiceFilter(); try { if (dc) dc.close(); } catch (e) {} try { if (pc) pc.close(); } catch (e) {} try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch (e) {} pc = dc = micStream = null; els.start.disabled = false; els.stop.disabled = true; }
  function stop() { if (stopped) return; stopped = true; clearSilence(); if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; } setStatus('상담을 종료합니다...'); cleanup(); reportCallCompleted(new Date().toISOString()); setStatus('■ 상담이 끝났습니다. 이용해 주셔서 감사합니다.'); }
  els.start.onclick = start; els.stop.onclick = () => { ending = true; stop(); };
</script>
